<header class="d-flex align-items-center justify-content-between px-4 py-3">

    <div class="input-group" style="width: 260px;">
        <span class="input-group-text bg-secondary border-0 text-white-50">
            🔍
        </span>
        <input type="text" class="form-control bg-secondary border-0 text-white" placeholder="Search city..."
            [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" />
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-unit rounded-circle" [class.active]="unit === 'C'" (click)="setUnit('C')">
            °C
        </button>
        <button class="btn btn-unit rounded-circle" [class.active]="unit === 'F'" (click)="setUnit('F')">
            °F
        </button>
    </div>

</header>
